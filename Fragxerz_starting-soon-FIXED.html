<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fragxerz — STREAM STARTING SOON</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}.scene{position:absolute;inset:0;overflow:hidden;background:#000;isolation:isolate}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:0}
/* A restrained moving sheen confined to the emblem, rather than sweeping the whole screen */
.logo-shine{position:absolute;left:37%;top:17%;width:27%;height:38%;z-index:2;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(112deg,transparent 0%,transparent 39%,rgba(255,255,255,.0) 43%,rgba(255,255,255,.22) 48%,rgba(255,255,255,.05) 51%,transparent 56%,transparent 100%);transform:translateX(-180%) skewX(-8deg);animation:metalshine 11s ease-in-out infinite;mask-image:radial-gradient(ellipse at center,#000 17%,transparent 71%)}
/* independent breathing light, matching the reference red centerline */
.red-core{position:absolute;left:50%;top:0;width:2px;height:100%;z-index:1;pointer-events:none;background:linear-gradient(to bottom,transparent 0%,rgba(235,0,34,.24) 18%,rgba(255,0,38,.02) 40%,rgba(255,0,38,.16) 63%,rgba(255,0,38,.26) 89%,transparent 100%);filter:blur(3px);transform:translateX(-50%);animation:core 5.8s ease-in-out infinite}
.flare{position:absolute;width:3px;height:3px;border-radius:50%;background:#ff334e;box-shadow:0 0 8px 2px #f0092d,0 0 26px 5px rgba(220,0,24,.48);z-index:3;pointer-events:none;animation:flare 6s ease-in-out infinite}
.flare.top{left:50%;top:13%}.flare.bottom{left:50%;bottom:4%;animation-delay:-3s}.flare.left{left:1%;top:49%;animation-delay:-1.5s}.flare.right{right:1%;top:49%;animation-delay:-4.5s}
/* subtle breathing vignette, never hiding text */
.ambient{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 25% 33% at 50% 34%,rgba(160,0,20,.055),transparent 75%);animation:ambient 8s ease-in-out infinite}
@keyframes metalshine{0%,52%{transform:translateX(-180%) skewX(-8deg);opacity:0}56%{opacity:1}73%{transform:translateX(180%) skewX(-8deg);opacity:.75}78%,100%{transform:translateX(180%) skewX(-8deg);opacity:0}}
@keyframes core{0%,100%{opacity:.25;filter:blur(4px)}50%{opacity:.95;filter:blur(2px)}}
@keyframes flare{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1.5)}}
@keyframes ambient{0%,100%{opacity:.15}50%{opacity:.9}}
@media(prefers-reduced-motion:reduce){.logo-shine,.red-core,.flare,.ambient{animation:none}}
