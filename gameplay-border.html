<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}.frame{position:absolute;inset:1.4%;border:1px solid rgba(210,215,224,.38);clip-path:polygon(0 3%,3% 0,97% 0,100% 3%,100% 97%,97% 100%,3% 100%,0 97%);pointer-events:none}.corner{position:absolute;width:9%;height:13%;border:2px solid #d3d4db;filter:drop-shadow(0 0 3px #b41434);opacity:.75}.tl{top:1.4%;left:1.4%;border-right:0;border-bottom:0}.tr{top:1.4%;right:1.4%;border-left:0;border-bottom:0}.bl{bottom:1.4%;left:1.4%;border-right:0;border-top:0}.br{bottom:1.4%;right:1.4%;border-left:0;border-top:0}.line{position:absolute;height:2px;width:18%;background:linear-gradient(90deg,transparent,#f32143,transparent);box-shadow:0 0 8px #e31538;animation:travel 11s ease-in-out infinite alternate}.top{top:1.4%;left:3%}.bottom{bottom:1.4%;right:3%;animation-delay:-5s}.logo{position:absolute;right:3%;bottom:3%;color:white;font:italic 900 clamp(22px,3vw,58px) Arial;transform:skew(-12deg);text-shadow:2px 2px #9b102a,0 0 9px #9b102a55}.spark{position:absolute;width:5px;height:5px;background:#f44;box-shadow:0 0 15px #e22;animation:blink 4s infinite}.s1{top:1.4%;left:50%}.s2{bottom:1.4%;left:50%;animation-delay:2s}@keyframes travel{from{transform:translateX(0);opacity:.25}to{transform:translateX(320%);opacity:.85}}@keyframes blink{0%,100%{opacity:.15}50%{opacity:1}}</style></head><body><div class="frame"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><div class="line top"></div><div class="line bottom"></div><div class="spark s1"></div><div class="spark s2"></div><div class="logo">F</div></body></html>
